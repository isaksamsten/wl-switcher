[package]
name = "wl-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Alt+Tab application and window switcher for Wayland compositors"

# The same dependency set (and versions) as wl-expose, whose modules are
# ported here (see PLAN.md).
[dependencies]
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.17"
drm-fourcc = "2"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
freedesktop-icons = "0.4"
gbm = { version = "0.18", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.50", default-features = false }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = "0.21"
toml = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

